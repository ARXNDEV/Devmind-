[project]
name = "devmind-code-intel"
version = "0.1.0"
description = "DevMind AI code-intelligence engine: parsing, graphs, retrieval, agents"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.4",
    "arq>=0.26",
    "asyncpg>=0.29",
    "redis>=5.0",
    "qdrant-client>=1.12",
    "neo4j>=5.24",
    "boto3>=1.35",
    "httpx>=0.27",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-typescript>=0.23.2",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-go>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devmind_code_intel"]

[tool.ruff]
line-length = 96
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
packages = ["devmind_code_intel"]
mypy_path = "src"

# Third-party libraries that ship no type information.
[[tool.mypy.overrides]]
module = ["asyncpg.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
