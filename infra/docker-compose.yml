name: devmind

# Data-store infrastructure for local dev and single-host pilots.
# App services (web/api/code-intel) are added by infra/docker-compose.apps.yml
# so day-to-day dev can run apps on the host against containerized stores.
#
# All host port bindings are loopback-only: nothing here is reachable from
# outside the machine. Credentials below are dev defaults; pilots must
# override via environment (see .env.example).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devmind
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devmind_dev}
      POSTGRES_DB: devmind
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmind -d devmind"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.1
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333" # HTTP
      - "127.0.0.1:6334:6334" # gRPC
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-devmind_dev_neo4j}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    ports:
      - "127.0.0.1:7474:7474" # HTTP browser
      - "127.0.0.1:7687:7687" # Bolt
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio:
    # TODO(pilot): pin to a RELEASE.* tag at first deployment; digest recorded in verification notes.
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devmind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devmind_dev_minio}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # Console
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local model server (ADR-0008): all inference, zero API keys. GPU is
  # auto-detected if present on the host; otherwise runs on CPU.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama --version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: pulls the configured models, then exits. First run downloads
  # several GB — subsequent runs are cache hits and return immediately.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      LLM_MODEL: ${CI_LLM_MODEL:-qwen2.5-coder:7b}
      EMBED_MODEL: ${CI_EMBED_MODEL:-nomic-embed-text}
    entrypoint: >
      /bin/sh -c "
      ollama pull $${EMBED_MODEL} &&
      ollama pull $${LLM_MODEL} &&
      echo 'models ready'
      "
    restart: "no"

  # One-shot: creates the buckets code-intel expects, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-devmind} $${MINIO_ROOT_PASSWORD:-devmind_dev_minio} &&
      mc mb --ignore-existing local/devmind-snapshots local/devmind-artifacts local/devmind-archives &&
      echo 'buckets ready'
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-devmind}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-devmind_dev_minio}

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  minio_data:
  ollama_data:
